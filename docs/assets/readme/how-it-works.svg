<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" role="img" aria-labelledby="title desc">
  <title id="title">How SAKO fits your project</title>
  <desc id="desc">You direct agent sessions. The agents invoke SAKO through commands or hooks. SAKO returns context and findings, reads and writes task records, runs your configured checks, and reads Git changes. The person or agent commits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#667e88" stroke-width="1.5"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#007b68" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; fill: #243944; }
    .node { font-size: 22px; font-weight: 650; }
    .edge { font-size: 17px; fill: #47616d; }
    .flow { fill: none; stroke: #667e88; stroke-width: 1.6; marker-end: url(#arrow); }
    .box { fill: #fff; stroke: #c0ced3; }
  </style>
  <rect width="560" height="520" rx="20" fill="#f2f6f6"/>
  <rect x="192" y="24" width="176" height="54" rx="12" class="box"/>
  <text x="280" y="59" class="node">You</text>
  <path d="M 280 78 V 126" class="flow"/>
  <text x="324" y="108" class="edge">direct</text>
  <rect x="176" y="128" width="208" height="58" rx="12" class="box"/>
  <text x="280" y="165" class="node">Agent sessions</text>
  <path d="M 240 186 V 284" class="flow"/>
  <text x="141" y="230" class="edge">commands</text>
  <text x="141" y="253" class="edge">or hooks</text>
  <path d="M 320 286 V 188" fill="none" stroke="#007b68" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#feedback)"/>
  <text x="416" y="230" class="edge">context</text>
  <text x="416" y="253" class="edge">and findings</text>
  <rect x="192" y="286" width="176" height="58" rx="12" fill="#d5f4e9" stroke="#5aab98"/>
  <text x="280" y="323" class="node">SAKO</text>
  <path d="M 228 344 V 373 H 102 V 444" class="flow"/>
  <path d="M 280 344 V 444" class="flow"/>
  <path d="M 332 344 V 373 H 458 V 444" class="flow"/>
  <rect x="47" y="400" width="110" height="26" fill="#f2f6f6"/>
  <rect x="233" y="400" width="94" height="26" fill="#f2f6f6"/>
  <rect x="398" y="400" width="120" height="26" fill="#f2f6f6"/>
  <text x="102" y="419" class="edge">read / write</text>
  <text x="280" y="419" class="edge">run checks</text>
  <text x="458" y="419" class="edge">read changes</text>
  <rect x="24" y="446" width="156" height="50" rx="12" class="box"/>
  <rect x="202" y="446" width="156" height="50" rx="12" class="box"/>
  <rect x="380" y="446" width="156" height="50" rx="12" class="box"/>
  <text x="102" y="478" class="node" style="font-size:20px">Task records</text>
  <text x="280" y="478" class="node" style="font-size:20px">Your checks</text>
  <text x="458" y="478" class="node">Git</text>
</svg>
