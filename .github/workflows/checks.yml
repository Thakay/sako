name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suites:
    name: Suites on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash  # Git Bash on Windows, where Claude Code runs SAKO's hooks
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and scenario suites
        run: python -m unittest discover -s tests -v
      - name: Standalone scenario suite
        run: python tests/selftest.py

  package:
    name: Package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Build the wheel and source archive
        run: uv build
      - name: Install from the wheel with no flags in a fresh repository
        run: |
          wheel=$(ls "$PWD"/dist/sako-*.whl)
          project=$(mktemp -d)
          git init -q "$project"
          cd "$project"
          printf '# Rules for the agent\n' > CLAUDE.md
          uvx --from "$wheel" sako init
          test -f .sako/sako.py
          test -f .claude/settings.local.json
          test -z "$(git status --porcelain --untracked-files=all -- .sako .claude/settings.local.json)"
          python3 .sako/sako.py next
