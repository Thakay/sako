name: Bug report
description: SAKO did something wrong or unexpected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic examples and remove private project details. To report a vulnerability, follow SECURITY.md instead.
  - type: textarea
    id: happened
    attributes:
      label: What you ran and what it printed
      description: The smallest reproduction, with the commands and their full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SAKO version
      description: The output of `python3 .sako/sako.py --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Python and Git
      placeholder: Ubuntu 24.04, Python 3.12.3, Git 2.43.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and its version
      placeholder: Claude Code 2.1.280, Codex 0.154.0, or none
  - type: dropdown
    id: footprint
    attributes:
      label: Footprint
      options:
        - local
        - repo
        - shared
        - not sure
  - type: textarea
    id: status
    attributes:
      label: Output of python3 .sako/sako.py status
      render: text
